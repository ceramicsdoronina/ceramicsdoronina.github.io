name: test

on:
  push:
  pull_request:

jobs:
  node-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # la shell espande il glob: funziona identica su Node 20 e successivi
      - name: Run tests
        run: node --test test/*.test.js
