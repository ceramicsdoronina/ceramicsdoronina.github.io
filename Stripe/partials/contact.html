<section id="contact" class="section">
  <div class="container contact-block">
    <h3 class="section-title" data-i18n="contact.title">Contatti</h3>

    <div class="contact-grid-2">
      <div class="contact-left">
        <div class="contact-row">
          <div class="contact-label" data-i18n="contact.addressLabel">Indirizzo</div>
          <div class="contact-value">
            <span data-i18n="contact.addressValue">Via San Donato 17R, 16123 Genova</span>
            <span data-i18n="contact.countrySuffix"> (Italia)</span>
          </div>
        </div>

        <div class="contact-row">
          <div class="contact-label" data-i18n="contact.phoneLabel">Telefono</div>
          <div class="contact-value"><a href="tel:+393806327838">+39 380 632 7838</a></div>
        </div>

        <div class="contact-row">
          <div class="contact-label" data-i18n="contact.emailLabel">Email</div>
          <div class="contact-value"><a href="mailto:ceramist.doronina@gmail.com">ceramist.doronina@gmail.com</a></div>
        </div>

        <div class="contact-row">
          <div class="contact-label" data-i18n="contact.hoursLabel">Orari</div>
          <div class="contact-hours">
            <div class="contact-hours-days" data-i18n="contact.hoursDays">Lun–Ven</div>
            <div class="contact-hours-line">
              <span class="contact-hours-time" data-i18n="contact.hoursFrom">10:00</span>
              <span class="contact-hours-dash" aria-hidden="true"></span>
              <span class="contact-hours-time" data-i18n="contact.hoursTo">19:00</span>
            </div>
          </div>
        </div>
      </div>

      <div class="contact-right">
        <!-- Coordinate dell'ingresso del 17 ROSSO (17R): sul lato OPPOSTO della via stretta rispetto al punto OpenStreetMap del civico (44.4059924, 8.9319088), ottenuto specchiando quel punto rispetto all'asse della via. Il 17 nero e' ~40 m piu' a ovest. Google da solo risolve "17r" sul nero. -->
        <div class="contact-map">
          <iframe
            src="https://www.google.com/maps?q=44.4059252,8.9318800(Via%20San%20Donato%2017R)&z=19&output=embed"
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade"
            allowfullscreen
            title="Studio map">
          </iframe>
        </div>
      </div>
    </div>

    <div class="contact-icons-row">
      <a class="contact-icon-btn" href="https://instagram.com/ceramics_doronina" target="_blank" rel="noopener" aria-label="Instagram">
        <img src="images/instagram.amore.s.png" alt="Instagram">
      </a>
      <a class="contact-icon-btn" href="mailto:ceramist.doronina@gmail.com" aria-label="Email">
        <img src="images/email.amore.s.png" alt="Email">
      </a>
      <a class="contact-icon-btn" href="https://wa.me/393806327838" target="_blank" rel="noopener" aria-label="WhatsApp">
        <img src="images/whatsapp.amore.s.png" alt="WhatsApp">
      </a>
    </div>
  </div>
</section>
