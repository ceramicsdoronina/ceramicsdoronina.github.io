<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pagamento annullato</title>
  <meta name="robots" content="noindex" />
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial; margin:0; padding:32px; color:#111;}
    .box{max-width:720px; margin:0 auto; border:1px solid #e5e5e5; padding:18px 20px;}
    .muted{color:#666;}
  </style>
  <script src="messages.js"></script>
</head>
<body>
  <div class="box" role="status" aria-live="polite">
    <h1 id="t">Pagamento annullato</h1>
    <p class="muted" id="p">Nessun addebito effettuato. Ti riporto al catalogo…</p>
    <p><a id="back" href="/#catalogue">Torna al catalogo</a></p>
  </div>

  <script>
    (function () {
      const PENDING_KEY = "cd_checkout_pending";   // stessa chiave di Stripe/js/uiStripe.js
      const REDIRECT_DELAY_MS = 1500;

      let lang = "it";
      try { lang = (localStorage.getItem("cd_lang") || "it").slice(0, 2); }
      catch (err) { console.warn("[cancel] cd_lang non leggibile:", err); }
      const all = window.messages || {};
      if (!all[lang]) lang = "it";
      const dict = (all[lang] && all[lang].checkoutStatus) || {};

      document.documentElement.lang = lang;
      if (dict.cancelTitle) {
        document.title = dict.cancelTitle;
        document.getElementById("t").textContent = dict.cancelTitle;
      }
      if (dict.cancelBody) document.getElementById("p").textContent = dict.cancelBody;
      if (dict.backToCatalogue) document.getElementById("back").textContent = dict.backToCatalogue;

      // Il carrello non si tocca: si elimina solo il marcatore del checkout in sospeso.
      try { localStorage.removeItem(PENDING_KEY); }
      catch (err) { console.warn("[cancel] rimozione cd_checkout_pending fallita:", err); }

      setTimeout(function () {
        window.location.replace(window.location.origin + "/#catalogue");
      }, REDIRECT_DELAY_MS);
    })();
  </script>
</body>
</html>
