<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pagamento riuscito</title>
  <meta name="robots" content="noindex" />
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial; margin:0; padding:32px; color:#111;}
    .box{max-width:720px; margin:0 auto; border:1px solid #e5e5e5; padding:18px 20px;}
    .muted{color:#666;}
  </style>
  <script src="messages.js"></script>
</head>
<body>
  <div class="box" role="status" aria-live="polite">
    <h1 id="t">Pagamento riuscito</h1>
    <p class="muted" id="p">Il tuo ordine è in fase di processamento, a breve riceverai un messaggio.</p>
    <p><a id="back" href="/#catalogue">Torna al catalogo</a></p>
  </div>

  <script>
    (function () {
      // Stesse chiavi di Stripe/js/uiStripe.js
      const CART_KEY = "cd_stripe_cart_v1";
      const PENDING_KEY = "cd_checkout_pending";
      const REDIRECT_DELAY_MS = 2500;

      function readJson(key, fallback) {
        try {
          const raw = localStorage.getItem(key);
          return raw ? JSON.parse(raw) : fallback;
        } catch (err) {
          console.warn("[success] lettura " + key + " fallita:", err);
          return fallback;
        }
      }

      let lang = "it";
      try { lang = (localStorage.getItem("cd_lang") || "it").slice(0, 2); }
      catch (err) { console.warn("[success] cd_lang non leggibile:", err); }
      const all = window.messages || {};
      if (!all[lang]) lang = "it";
      const dict = (all[lang] && all[lang].checkoutStatus) || {};

      document.documentElement.lang = lang;
      if (dict.successTitle) {
        document.title = dict.successTitle;
        document.getElementById("t").textContent = dict.successTitle;
      }
      if (dict.success) document.getElementById("p").textContent = dict.success;
      if (dict.backToCatalogue) document.getElementById("back").textContent = dict.backToCatalogue;

      // Rimuove dal carrello SOLO le righe dell'ordine pagato, e solo se il session_id
      // dell'URL coincide con quello salvato all'avvio del checkout.
      try {
        const pending = readJson(PENDING_KEY, null);
        const sid = new URLSearchParams(window.location.search).get("session_id");

        if (pending && typeof pending.session_id === "string" && sid && sid === pending.session_id
            && Array.isArray(pending.ids)) {
          const ids = new Set(pending.ids.map(String));
          const cart = readJson(CART_KEY, []);
          if (Array.isArray(cart)) {
            const rest = cart.filter(function (line) { return !(line && ids.has(String(line.id))); });
            localStorage.setItem(CART_KEY, JSON.stringify(rest));
          }
        }
      } catch (err) {
        console.warn("[success] aggiornamento carrello fallito:", err);
      }

      try { localStorage.removeItem(PENDING_KEY); }
      catch (err) { console.warn("[success] rimozione cd_checkout_pending fallita:", err); }

      setTimeout(function () {
        window.location.replace(window.location.origin + "/#catalogue");
      }, REDIRECT_DELAY_MS);
    })();
  </script>
</body>
</html>
