<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pagamento riuscito</title>
  <meta name="robots" content="noindex" />
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial; margin:0; padding:32px; color:#111;}
    .box{max-width:720px; margin:0 auto; border:1px solid #e5e5e5; padding:18px 20px;}
    .muted{color:#666;}
  </style>
  <script src="messages.js"></script>
  <script src="Stripe/js/cart.js"></script>
</head>
<body>
  <div class="box" role="status" aria-live="polite">
    <h1 id="t">Pagamento riuscito</h1>
    <p class="muted" id="p">Pagamento ricevuto. Stripe ti invierà la ricevuta via email. Ti contatterò per la consegna.</p>
    <p class="muted" id="ref" hidden></p>
    <p><a id="back" href="/#catalogue">Torna al catalogo</a></p>
  </div>

  <script>
    (function () {
      // Chiavi e logica da Stripe/js/cart.js (stesse di Stripe/js/uiStripe.js)
      const cartLib = window.CD && window.CD.cart;
      const CART_KEY = cartLib ? cartLib.CART_KEY : "cd_stripe_cart_v1";
      const PENDING_KEY = cartLib ? cartLib.PENDING_KEY : "cd_checkout_pending";

      function readJson(key, fallback) {
        try {
          const raw = localStorage.getItem(key);
          return raw ? JSON.parse(raw) : fallback;
        } catch (err) {
          console.warn("[success] lettura " + key + " fallita:", err);
          return fallback;
        }
      }

      let lang = "it";
      try { lang = (localStorage.getItem("cd_lang") || "it").slice(0, 2); }
      catch (err) { console.warn("[success] cd_lang non leggibile:", err); }
      const all = window.messages || {};
      if (!all[lang]) lang = "it";
      const dict = (all[lang] && all[lang].checkoutStatus) || {};

      document.documentElement.lang = lang;
      if (dict.successTitle) {
        document.title = dict.successTitle;
        document.getElementById("t").textContent = dict.successTitle;
      }
      if (dict.success) document.getElementById("p").textContent = dict.success;
      if (dict.backToCatalogue) document.getElementById("back").textContent = dict.backToCatalogue;

      const sid = new URLSearchParams(window.location.search).get("session_id");

      // Riferimento ordine breve: ultimi 8 caratteri dopo il prefisso "cs_test_/cs_live_"
      // (i primi 8 sarebbero sempre il prefisso). Utile per cercare la sessione nella Dashboard Stripe.
      if (typeof sid === "string" && /^cs_(test|live)_[A-Za-z0-9]{8,}$/.test(sid)) {
        const ref = document.getElementById("ref");
        ref.textContent = (dict.orderRef || "Order reference") + ": " + sid.slice(-8);
        ref.hidden = false;
      }

      // Rimuove dal carrello SOLO le righe dell'ordine pagato e SOLO la voce di questa sessione
      // nella mappa cd_checkout_pending; un session_id che non corrisponde non cambia nulla.
      try {
        if (!cartLib) throw new Error("cart.js non caricato");
        const map = cartLib.normalizePending(readJson(PENDING_KEY, null));
        const cart = readJson(CART_KEY, []);
        const res = cartLib.pendingAfterSuccess(map, sid, Array.isArray(cart) ? cart : []);
        if (res.matched) {
          // prima il carrello (id dell'ordine), poi la voce del marcatore
          if (Array.isArray(cart)) localStorage.setItem(CART_KEY, JSON.stringify(res.cart));
          if (Object.keys(res.map).length) localStorage.setItem(PENDING_KEY, JSON.stringify(res.map));
          else localStorage.removeItem(PENDING_KEY);
        }
      } catch (err) {
        console.warn("[success] aggiornamento carrello fallito:", err);
      }
      // nessun redirect automatico: la pagina resta finche' l'utente non usa il link
    })();
  </script>
</body>
</html>
